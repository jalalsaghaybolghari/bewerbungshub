server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls (apps/web/src/lib/api-client.ts's API_BASE is
    # the relative path '/api/v1') — proxied to the api container over the
    # Docker network, not rewritten, since the API already serves under
    # this exact prefix (app.setGlobalPrefix('api/v1', ...)).
    location /api/v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routed SPA (react-router's BrowserRouter) — any path
    # that isn't a real static file falls back to index.html so deep
    # links and refreshes on e.g. /applications/123 work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
