# Production deploy — separate from docker-compose.yml, which is local-dev
# infra only (mongo/redis/minio). Here mongo runs natively on the host
# (not in a container), so only the app's own services (+ this Redis,
# below) are defined.
services:
  # BullMQ's job queue store (Gmail sync, apps/api/src/gmail/) — purely
  # disposable job/queue state, not a database, so no volume backup
  # strategy needed the way mongo's is handled. Not exposed to the host —
  # reached only by `api` over the compose network at redis:6379.
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:3000:3000'
    # Lets the container reach MongoDB running on the host itself —
    # 127.0.0.1 inside the container is the container's own loopback, not
    # the host's, so this is the standard way to bridge that on Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api
      - mcp

  # MCP (Model Context Protocol) server — lets Claude.ai's custom connector
  # feature call the api on a user's behalf via their personal API key
  # (see AuthService.generateApiKey). Reached only through web's nginx
  # proxy at /mcp, never bound to the host directly.
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    environment:
      BEWERBUNGSHUB_API_BASE: http://api:3000/api/v1
    depends_on:
      - api

  # Standalone admin panel — separate app, separate login, served on its
  # own subdomain (admin.bewerbungshub.com) via a dedicated host nginx
  # server block, not through web's nginx at all.
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:80'
    depends_on:
      - api

volumes:
  api_uploads:
  redis_data:
