<!--
  Synthetic fixture, not a captured real page — unlike linkedin-job.html,
  this adapter hasn't been verified against real Indeed markup (no
  browser tool available). Standard shape of the schema.org/JobPosting
  structured data Indeed is expected to publish for SEO, matching what
  extractJsonLd already parses and is tested against elsewhere.
-->
<!doctype html>
<html>
  <head>
    <title>QA Engineer - Indeed.com</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "JobPosting",
        "title": "QA Engineer",
        "hiringOrganization": { "@type": "Organization", "name": "Sample Inc." },
        "jobLocation": {
          "@type": "Place",
          "address": { "@type": "PostalAddress", "addressLocality": "Berlin", "addressCountry": "DE" }
        },
        "description": "<p>We are looking for a QA Engineer to join our team.</p>"
      }
    </script>
  </head>
  <body>
    <h1>QA Engineer</h1>
  </body>
</html>
